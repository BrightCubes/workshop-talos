apiVersion: v1
kind: Namespace
metadata:
  name: game-2048
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "game-2048"
  namespace: game-2048
spec:
  selector:
    matchLabels:
      app: "2048"
  replicas: 3
  template:
    metadata:
      labels:
        app: "2048"
    spec:
      containers:
        # Multi-arch (amd64 + arm64), pinned to a digest
        - image: amigoscode/2048@sha256:45a893ee62267d2825ffefb3b98e860de9716a5bb80091a84967d2bd427990db
          imagePullPolicy: IfNotPresent
          name: "2048"
          ports:
            - containerPort: 80
              protocol: TCP
          securityContext:
            privileged: true
            seccompProfile:
              type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: "2048"
  name: "game-2048"
  namespace: game-2048
spec:
  ports:
    - nodePort: 30080
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: "2048"
  type: NodePort
