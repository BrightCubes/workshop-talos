name: talos-workshop

networks:
  talos-workshop:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/24"
          gateway: "172.20.0.1"

volumes:
  # ControlPlane
  cp_var:
  cp_etc-cni:
  cp_etc-kubernetes:
  cp_usr-libexec-kubernetes:
  cp_opt:
  cp_system-state:

  # Worker
  worker_var:
  worker_etc-cni:
  worker_etc-kubernetes:
  worker_usr-libexec-kubernetes:
  worker_opt:
  worker_system-state:


services:
  talos-cp:
    # TALOS_VERSION is set in .env
    image: ghcr.io/siderolabs/talos:${TALOS_VERSION}
    hostname: talos-cp
    container_name: talos-cp
    environment:
      - PLATFORM=container
    read_only: true
    privileged: true
    ports:
      # Talos API
      - "127.0.0.1:50000:50000"
      # Kubernetes API
      - "127.0.0.1:6443:6443"
    security_opt:
      - seccomp=unconfined
    volumes:
      - cp_var:/var
      - cp_etc-cni:/etc/cni
      - cp_etc-kubernetes:/etc/kubernetes
      - cp_usr-libexec-kubernetes:/usr/libexec/kubernetes
      - cp_opt:/opt
      - cp_system-state:/system/state
    tmpfs:
      - /run
      - /system
      - /tmp
    networks:
      talos-workshop:
        ipv4_address: 172.20.0.100

  talos-worker:
    image: ghcr.io/siderolabs/talos:${TALOS_VERSION}
    hostname: talos-worker
    container_name: talos-worker
    environment:
      - PLATFORM=container
    read_only: true
    privileged: true
    ports:
      # Talos API, only needed to apply the first config (maintenance mode)
      - "127.0.0.1:50001:50000"
      # Workload NodePort
      - "127.0.0.1:30080:30080"
    security_opt:
      - seccomp=unconfined
    volumes:
      - worker_var:/var
      - worker_etc-cni:/etc/cni
      - worker_etc-kubernetes:/etc/kubernetes
      - worker_usr-libexec-kubernetes:/usr/libexec/kubernetes
      - worker_opt:/opt
      - worker_system-state:/system/state
    tmpfs:
      - /run
      - /system
      - /tmp
    networks:
      talos-workshop:
        ipv4_address: 172.20.0.150
